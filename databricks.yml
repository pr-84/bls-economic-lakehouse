bundle:
  name: bls-economic-lakehouse

variables:
  catalog:
    description: Unity Catalog catalog that stores the pipeline tables.
    default: macroeconomic_data
  schema:
    description: Unity Catalog schema that stores the pipeline tables.
    default: raw_data
  warehouse_id:
    description: SQL warehouse used by the AI/BI dashboard datasets.
    default: d882f61c1aba2efd

sync:
  include:
    - src/pipeline/*.py
  exclude:
    - src/dashboards/*.lvdash.json

resources:
  pipelines:
    bls_economic_medallion_pipeline:
      name: BLS_Economic_Medallion_Pipeline
      catalog: ${var.catalog}
      target: ${var.schema}
      edition: ADVANCED
      channel: CURRENT
      continuous: false
      libraries:
        - glob:
            include: src/pipeline/dlt_pipeline.py

  dashboards:
    bls_economic_medallion_dashboard:
      display_name: BLS Economic Medallion Dashboard
      warehouse_id: ${var.warehouse_id}
      dataset_catalog: ${var.catalog}
      dataset_schema: ${var.schema}
      file_path: src/dashboards/bls_economic_medallion_dashboard.json

targets:
  dev:
    default: true
    mode: development
